services:
  - type: web
    name: tt-04-digital-card
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tt-04-digital-card-db
          property: connectionString

databases:
  - name: tt-04-digital-card-db
    plan: free
    databaseName: digital_card
    user: digital_card